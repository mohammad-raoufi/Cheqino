name: Android - Build

on:
  push:
    branches: [main]
    paths:
      - mobile/android/**
      - packages/**
      - apps/web/**
      - .github/workflows/android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: mobile/android
      - name: Build web assets and sync into the Android project
        run: npm run sync
        working-directory: mobile/android
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android/android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/android/app/build/outputs/apk/debug/app-debug.apk
